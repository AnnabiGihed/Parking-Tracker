name: MAUI Android APK

# Builds the .NET MAUI app on the migration branch and runs the emulator test on it (docs/architecture.md sections 4.1, 6.3, 7).
# The host project needs the maui-android workload, which developer PCs may not have, so only this workflow builds it.
# It never publishes a release and never runs for main; the Capacitor workflow (android.yml) keeps releasing until cut-over.
#   1. build - Release APK, and the same code with the test hooks (-p:EnableTestHooks=true); both signed with the debug key
#   2. test  - install the test-hooks APK on an Android 14 emulator and check the answers, the screen, the parking alert service and the timer
#   3. upgrade-test - build the last Capacitor code, sign it and the test-hooks APK with one throwaway key, install the first, store a card,
#      install the second over it and check that the card came over (ADR-0004, ADR-0008); runs in parallel to the emulator test
on:
  push:
    branches: [chore/maui-migration]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: maui-android-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  APP_PROJECT: src/Containers/UI/Hosting/ParkingTracker.App/ParkingTracker.App.csproj

jobs:
  build:
    name: Build the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # These APKs are never released and carry the debug key, so the run number is used as it is (no offset above the
      # last Capacitor release); the version guards belong to the release workflow of stage 7.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      # Only the restore needs the package token; nuget.config reads it from these variables.
      - name: Restore
        env:
          GITHUB_PACKAGES_USER: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore "$APP_PROJECT"

      - name: Install the Android SDK packages the build needs
        run: >
          dotnet build "$APP_PROJECT" -f net10.0-android -t:InstallAndroidDependencies --no-restore
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Publish the Release APK
        run: >
          dotnet publish "$APP_PROJECT" -f net10.0-android -c Release --no-restore
          -p:ApplicationVersion="$VERSION_CODE" -p:ApplicationDisplayVersion="1.0.$VERSION_CODE"
          -o "$RUNNER_TEMP/publish-plain"

      - name: Keep the Release APK
        run: bash test/ParkingTracker.E2E.Tests/collect-apk.sh "$RUNNER_TEMP/publish-plain" "$RUNNER_TEMP/apk/ParkingTracker.apk"

      # The test-hooks build changes a compile constant, so start from clean intermediate output of the host.
      - name: Publish the test-hooks APK (same Release code plus window.ptTest)
        run: |
          rm -rf "$(dirname "$APP_PROJECT")/bin" "$(dirname "$APP_PROJECT")/obj/Release"
          dotnet publish "$APP_PROJECT" -f net10.0-android -c Release --no-restore \
            -p:EnableTestHooks=true -p:ApplicationVersion="$VERSION_CODE" -p:ApplicationDisplayVersion="1.0.$VERSION_CODE" \
            -o "$RUNNER_TEMP/publish-hooks"
          bash test/ParkingTracker.E2E.Tests/collect-apk.sh "$RUNNER_TEMP/publish-hooks" "$RUNNER_TEMP/apk/ParkingTracker-test.apk"

      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maui-apks
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Emulator test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maui-apks
          path: apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node test/ParkingTracker.E2E.Tests/emulator-test.mjs apk/ParkingTracker-test.apk

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maui-emulator-report
          path: emulator-report/
          if-no-files-found: ignore
          retention-days: 7

  # ADR-0004, ADR-0008: the saved card must survive the update. The Capacitor build and the MAUI test-hooks build both get the same throwaway
  # key, so that `adb install -r` accepts the update and keeps the app data. Until cut-over the Capacitor code is on this branch.
  upgrade-test:
    name: Upgrade test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # The Capacitor build gets the lowest versionCode, so any MAUI build (the run number) is the update.
      CAPACITOR_VERSION_CODE: "1"
      # The key is throwaway: it lives in the runner's temp directory, is valid for two days and signs nothing that is published, so
      # a fixed password is fine and no secret is needed.
      UPGRADE_KEY_PASSWORD: upgrade-test-only
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Download the MAUI APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maui-apks
          path: apk

      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/upgrade.p12" -storetype PKCS12 \
            -storepass "$UPGRADE_KEY_PASSWORD" -keypass "$UPGRADE_KEY_PASSWORD" \
            -alias upgrade -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Parking Tracker upgrade test"

      # A debug build has web view debugging on (Capacitor's webContentsDebuggingEnabled defaults to the debuggable flag).
      - name: Build the Capacitor debug APK
        env:
          VERSION_CODE: ${{ env.CAPACITOR_VERSION_CODE }}
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sign both APKs with the throwaway key
        run: |
          bash test/ParkingTracker.E2E.Tests/resign-apk.sh android/app/build/outputs/apk/debug/app-debug.apk upgrade/capacitor.apk "$RUNNER_TEMP/upgrade.p12" upgrade
          bash test/ParkingTracker.E2E.Tests/resign-apk.sh apk/ParkingTracker-test.apk upgrade/maui-test.apk "$RUNNER_TEMP/upgrade.p12" upgrade

      - name: Check that the MAUI versionCode is higher
        run: |
          old="$(bash test/ParkingTracker.E2E.Tests/version-code.sh upgrade/capacitor.apk)"
          new="$(bash test/ParkingTracker.E2E.Tests/version-code.sh upgrade/maui-test.apk)"
          echo "Capacitor versionCode $old, MAUI versionCode $new"
          if [ -z "$old" ] || [ -z "$new" ] || [ "$new" -le "$old" ]; then
            echo "::error::The MAUI versionCode ($new) must be higher than the Capacitor versionCode ($old)."
            exit 1
          fi

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the Capacitor build, store a card, update to the MAUI build
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node test/ParkingTracker.E2E.Tests/upgrade-test.mjs upgrade/capacitor.apk upgrade/maui-test.apk

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maui-upgrade-report
          path: upgrade-report/
          if-no-files-found: ignore
          retention-days: 7
