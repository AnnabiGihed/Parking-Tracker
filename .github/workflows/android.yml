name: Android APK

# Builds and releases the .NET MAUI app (docs/architecture.md sections 4.1, 6.3, 7). The host project needs the
# maui-android workload, which developer PCs may not have, so only this workflow builds it. The file name stays
# android.yml so that github.run_number keeps counting from the runs of the earlier Capacitor workflow; the versionCode
# is the run number and must stay above the one of the latest release (v1.0.11 had 11).
#   1. build        - the Release APK signed with the release key, the same code with the test hooks (-p:EnableTestHooks=true,
#                     signed with the debug key), and the guards: the versionCode is higher than the latest release's and the
#                     signing certificate is the same, so that the phones accept the update
#   2. release      - publish the signed APK on the Releases page; only on a push to main, only after the build passed
# No job starts the app: the emulator test, the upgrade test and the cold-start budget run on a developer PC with the APKs
# of the apks artifact (test/ParkingTracker.E2E.Tests/README.md).
# Pull requests never use the release key: they are signed with the debug key and the certificate guard is skipped (the
# version guard still runs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A run on main may publish a release, so it is never cancelled; superseded runs of other refs are.
concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  APP_PROJECT: src/Containers/UI/Hosting/ParkingTracker.App/ParkingTracker.App.csproj

jobs:
  build:
    name: Build the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      # The release key signs only runs of main (pushes and manual runs). Every pull request, also from this repository,
      # and every other branch gets the debug key: such a run can execute changed workflow or build code, so it must not
      # touch the release key.
      SIGN_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      # Only the restore needs the package token; nuget.config reads it from these variables.
      - name: Restore
        env:
          GITHUB_PACKAGES_USER: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore "$APP_PROJECT"

      - name: Install the Android SDK packages the build needs
        run: >
          dotnet build "$APP_PROJECT" -f net10.0-android -t:InstallAndroidDependencies --no-restore
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Restore the release signing key
        if: env.SIGN_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing (see README, 'Signing key')."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # MSBuild reads environment variables as properties, so the passwords never appear on a command line or in the log.
      - name: Publish the Release APK (signed with the release key)
        if: env.SIGN_RELEASE == 'true'
        env:
          AndroidKeyStore: "true"
          AndroidSigningKeyStore: ${{ env.ANDROID_KEYSTORE_PATH }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish "$APP_PROJECT" -f net10.0-android -c Release --no-restore
          -p:ApplicationVersion="$VERSION_CODE" -p:ApplicationDisplayVersion="1.0.$VERSION_CODE"
          -o "$RUNNER_TEMP/publish-plain"

      - name: Publish the Release APK (debug key, no release key for this run)
        if: env.SIGN_RELEASE != 'true'
        run: >
          dotnet publish "$APP_PROJECT" -f net10.0-android -c Release --no-restore
          -p:ApplicationVersion="$VERSION_CODE" -p:ApplicationDisplayVersion="1.0.$VERSION_CODE"
          -o "$RUNNER_TEMP/publish-plain"

      - name: Keep the Release APK
        run: bash test/ParkingTracker.E2E.Tests/collect-apk.sh "$RUNNER_TEMP/publish-plain" "$RUNNER_TEMP/apk/ParkingTracker.apk"

      # The test-hooks build changes a compile constant, so start from clean intermediate output of the host. It gets no
      # release key: it is only installed on emulators.
      - name: Publish the test-hooks APK (same Release code plus window.ptTest)
        run: |
          rm -rf "$(dirname "$APP_PROJECT")/bin" "$(dirname "$APP_PROJECT")/obj/Release"
          dotnet publish "$APP_PROJECT" -f net10.0-android -c Release --no-restore \
            -p:EnableTestHooks=true -p:ApplicationVersion="$VERSION_CODE" -p:ApplicationDisplayVersion="1.0.$VERSION_CODE" \
            -o "$RUNNER_TEMP/publish-hooks"
          bash test/ParkingTracker.E2E.Tests/collect-apk.sh "$RUNNER_TEMP/publish-hooks" "$RUNNER_TEMP/apk/ParkingTracker-test.apk"

      - name: Guard the version (higher than the latest release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/version-guard.sh "$RUNNER_TEMP/apk/ParkingTracker.apk"

      - name: Guard the signing certificate (same as the latest release)
        if: env.SIGN_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/certificate-guard.sh "$RUNNER_TEMP/apk/ParkingTracker.apk"

      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 7

  # Only a push to main publishes; the migration branch and pull requests never do.
  release:
    name: Publish the release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: apk

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v1.0.${RUN_NUMBER}"
          {
            echo "Open this page on your Android phone, tap **ParkingTracker.apk** and install it."
            echo "Installed over the earlier version, it keeps your parking card."
            echo
            echo "Commit: ${COMMIT}"
          } > notes.md
          gh release create "$TAG" apk/ParkingTracker.apk \
            --target "$COMMIT" --title "Parking Tracker $TAG" --notes-file notes.md --latest
