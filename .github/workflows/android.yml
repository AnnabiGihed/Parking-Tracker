name: Android APK

# On every push to main:
#   1. build  — the signed APK to publish, plus a debug build of the same code for testing
#   2. test   — install the debug build on an Android emulator, put the GPS at Avenue Louise 216
#               and check what the app really does (native HTTP, permissions, GPS, answers)
#   3. release — publish the signed APK on the Releases page, only if the emulator test passed
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and copy the web app into the Android project
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see README, 'Android app')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK and the test build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/ParkingTracker.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/ParkingTracker-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: ${{ runner.temp }}/apk/

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node tools/emulator-test.mjs apk/ParkingTracker-test.apk

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report
          path: emulator-report/

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: emulator-report
          path: emulator-report

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          {
            echo "Open this page on your Android phone, tap **ParkingTracker.apk** and install it."
            echo
            cat emulator-report/summary.md
            echo
            echo "Commit: ${{ github.sha }}"
          } > notes.md
          gh release create "$TAG" apk/ParkingTracker.apk emulator-report/screenshot-avenue-louise-216.png \
            --title "Parking Tracker $TAG" --notes-file notes.md --latest
