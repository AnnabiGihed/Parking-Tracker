<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <title>Parking Tracker</title>
  <base href="/" />
  <!-- Radzen theme, then the file that sets its variables to the colours of the app, then the style of the app (ADR-0020). -->
  <link rel="stylesheet" href="_content/Radzen.Blazor/css/default-base.css" />
  <link rel="stylesheet" href="_content/ParkingTracker.Shared/css/radzen-theme.css" />
  <!-- Leaflet and its style are loaded by map.js from the same package, so the map starts offline. -->
  <link rel="stylesheet" href="_content/ParkingTracker.Shared/css/style.css" />
</head>
<body>
  <div id="app"></div>
  <!-- Root of the non-visual component that joins phone events (connection, resume, vibration) to the view models. -->
  <div id="platform-relay"></div>
  <!-- Root of the test hook installer; only a build made with -p:EnableTestHooks=true renders into it. -->
  <div id="test-hooks"></div>

  <div id="blazor-error-ui" style="display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10000; padding: 0.6rem 1.25rem; background: #fee2e2; color: #7f1d1d; font: 14px sans-serif;">
    An unhandled error has occurred.
    <a href="." style="margin-left: 0.5rem;">Reload</a>
    <button type="button" class="dismiss" aria-label="Close" style="float: right; border: 0; background: none; color: inherit; font: inherit; cursor: pointer;" onclick="this.parentElement.style.display = 'none'">&#x2715;</button>
  </div>

  <script src="_content/Radzen.Blazor/Radzen.Blazor.min.js"></script>
  <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
